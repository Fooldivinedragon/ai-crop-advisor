# Render Blueprint: free web service for the AI Crop Advisor website.
# The model is retrained during the build so it always matches the
# scikit-learn version installed on the server.
services:
  - type: web
    name: ai-crop-advisor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_model.py
    # AI explanations can take up to a minute, hence the long timeout
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set the value in the Render dashboard; never commit API keys
      - key: GEMINI_API_KEY
        sync: false
